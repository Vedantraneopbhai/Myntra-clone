services:
  - type: web
    name: myntra-backend
    runtime: node
    buildCommand: npm install --production
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        scope: project
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://myntra-clone-wntn.vercel.app
    plan: free
    region: oregon
